# Prithvi-EO-2.0 + LoRA — AerialWaste Segmentation
# Uses UNet decoder (recommended by IBM peft-geofm paper for complex tasks)
# Applied to the subset of AerialWaste images with segmentation masks

model:
  model_factory: EncoderDecoderFactory
  model_args:
    backbone: prithvi_eo_v2_300
    backbone_pretrained: true
    backbone_bands:
      - RED
      - GREEN
      - BLUE
    backbone_num_frames: 1
    decoder: UNetDecoder                 # UNet recommended over FCN/UperNet
    decoder_channels: 256
    num_classes: 2                       # Waste / background pixel segmentation
    necks:
      - name: SelectIndices
        indices: [5, 11, 17, 23]         # Extract features from 4 ViT layers
      - name: ReshapeTokensToImage

    peft_config:
      method: LORA
      replace_qkv: qkv
      peft_config_kwargs:
        target_modules:
          - qkv.q_linear
          - qkv.v_linear
          - mlp.fc1
          - mlp.fc2
        lora_alpha: 16
        r: 16
        lora_dropout: 0.1
        bias: none

task:
  loss: focal
  lr: 6.0e-5
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.01
  scheduler: OneCycleLR
  scheduler_hparams:
    pct_start: 0.1
  # Segmentation metrics
  metrics:
    - class_path: torchmetrics.JaccardIndex
      init_args:
        task: binary
    - class_path: torchmetrics.F1Score
      init_args:
        task: binary

data:
  train_data_root: data/processed/train
  val_data_root:   data/processed/val
  test_data_root:  data/processed/test
  img_grep: "*.jpg"
  label_grep: "*.png"                    # segmentation masks
  batch_size: 8                          # smaller due to higher memory for segmentation
  num_workers: 4
  image_size: 448                        # larger tiles for segmentation
  means: [0.485, 0.456, 0.406]
  stds:  [0.229, 0.224, 0.225]

trainer:
  max_epochs: 50
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/IoU
        mode: max
        save_top_k: 1
        filename: prithvi_lora_seg_best_{epoch:02d}_{val_IoU:.4f}
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/IoU
        patience: 15
        mode: max

logger:
  class_path: lightning.pytorch.loggers.CSVLogger
  init_args:
    save_dir: results/metrics
    name: prithvi_lora_segmentation
