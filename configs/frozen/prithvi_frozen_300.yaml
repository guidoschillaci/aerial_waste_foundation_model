# Prithvi-EO-2.0-300M frozen backbone — zero-shot linear probe

model:
  model_args:
    backbone: prithvi_eo_v2_300
    backbone_pretrained: true
    backbone_bands: [RED, GREEN, BLUE]
    backbone_num_frames: 1
    num_classes: 2
    freeze_backbone: true

task:
  loss: focal
  lr: 1.0e-3
  optimizer: AdamW
  optimizer_hparams:
    weight_decay: 0.01
  scheduler: OneCycleLR
  scheduler_hparams:
    pct_start: 0.1

data:
  batch_size: 32
  num_workers: 4
  image_size: 224
  means: [0.485, 0.456, 0.406]
  stds:  [0.229, 0.224, 0.225]

trainer:
  max_epochs: 20
